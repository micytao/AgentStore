# ---------------------------------------------------------------------------
# RHDH Software Template: Deploy an Existing Agent
# ---------------------------------------------------------------------------
# Self-service wizard that lets an end user pick a published AgentStore
# listing and trigger its one-time deploy to OpenShift (via AAP).  The
# scaffolder first fetches the catalog to populate a dropdown, then
# POSTs to the deploy endpoint.
#
# Requires:
#   - proxy endpoint "/agentstore" configured in app-config.yaml
#   - http:backstage:request scaffolder action enabled (dynamic-plugins.yaml)
# ---------------------------------------------------------------------------
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-existing-agent
  title: Deploy an Existing Agent
  description: >
    Pick a published agent from the AgentStore catalog and deploy it to
    OpenShift.  AAP provisions the workload; end users get a shareable
    chat link or terminal session once it is running.
  tags:
    - ai-agent
    - agentstore
    - deploy
spec:
  owner: group:default/platform-team
  type: ai-agent

  # -----------------------------------------------------------------------
  # Wizard pages
  # -----------------------------------------------------------------------
  parameters:
    - title: Select an agent to deploy
      required:
        - listingId
      properties:
        listingId:
          title: Agent listing ID
          type: string
          description: >
            The AgentStore listing ID of the agent you want to deploy
            (e.g. "redhat-sre-engineer").  Browse the AgentStore catalog
            to find the ID of a published listing that has not yet been
            deployed.
          ui:autofocus: true

    - title: Confirm deployment
      properties:
        confirmation:
          title: Ready to deploy?
          type: boolean
          description: >
            Deploying creates a persistent OpenShift Deployment (or
            OpenShell session) via AAP.  The agent will be accessible to
            everyone with the link once it is running.
          default: true

  # -----------------------------------------------------------------------
  # Scaffolder steps
  # -----------------------------------------------------------------------
  steps:
    # Step 1 -- Trigger the deploy via AgentStore's REST API.
    # POST /api/admin/listings/{id}/deploy starts (or restarts) the
    # AAP job that provisions the agent on OpenShift.
    - id: deploy-agent
      name: Deploy agent to OpenShift via AAP
      action: http:backstage:request
      input:
        method: POST
        path: /proxy/agentstore/admin/listings/${{ parameters.listingId }}/deploy
        headers:
          content-type: application/json

    # Step 2 -- Fetch the listing details so we can show useful output.
    - id: fetch-listing
      name: Fetch listing details
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/agentstore/listings?department=all
        headers:
          content-type: application/json

  # -----------------------------------------------------------------------
  # Outputs
  # -----------------------------------------------------------------------
  output:
    links:
      - title: View deployment status in AgentStore
        url: ${{ steps['deploy-agent'].output.body.agentStoreUrl }}
    text:
      - title: Deployment started
        content: >
          Agent "${{ parameters.listingId }}" is being deployed to
          OpenShift via AAP.  The deployment status will update in
          AgentStore.  Once status shows **Running**, the agent's
          shareable link will be available.
