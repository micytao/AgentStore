# ---------------------------------------------------------------------------
# RHDH app-config.yaml snippet for the AgentStore integration
# ---------------------------------------------------------------------------
# Mount this as a ConfigMap in the RHDH namespace and reference it in the
# Backstage CR:
#
#   oc create configmap agentstore-rhdh-app-config \
#     --from-file=app-config.yaml=rhdh/app-config-snippet.yaml \
#     -n rhdh
#
#   oc patch backstage developer-hub -n rhdh --type merge \
#     --patch '{"spec":{"application":{"appConfig":{"configMaps":[{"name":"agentstore-rhdh-app-config"}]}}}}'
#
# Replace CLUSTER_DOMAIN with your cluster's apps domain (e.g.
# apps.mycluster.example.com) and set the referenced env vars /
# secrets before deploying.
# ---------------------------------------------------------------------------

# -- Portal branding -------------------------------------------------------
app:
  title: Agent Store - Self-Service Portal
  baseUrl: https://backstage-developer-hub-rhdh.apps.CLUSTER_DOMAIN
  branding:
    title: Agent Store
    theme:
      light:
        variant: rhdh
        mode: light
        palette:
          primary:
            main: '#c9190b'
          navigation:
            color: '#ffffff'
            indicator: '#c9190b'
            selectedColor: '#ffffff'
          banner:
            info: '#c9190b'
            link: '#c9190b'
      dark:
        variant: rhdh
        mode: dark
        palette:
          primary:
            main: '#ef9234'
          navigation:
            color: '#ffffff'
            indicator: '#ef9234'
            selectedColor: '#ffffff'
          banner:
            info: '#ef9234'
            link: '#ef9234'

backend:
  baseUrl: https://backstage-developer-hub-rhdh.apps.CLUSTER_DOMAIN
  cors:
    origin: https://backstage-developer-hub-rhdh.apps.CLUSTER_DOMAIN
  reading:
    allow:
      - host: agentstore.agentstore.svc:3000
      - host: agentstore-agentstore.CLUSTER_DOMAIN

# -- Authentication --------------------------------------------------------
# Guest access only for demo / workshop use.  Replace with a real OIDC /
# RHSSO provider for production.
auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
signInPage: guest

# -- Proxy: route scaffolder HTTP calls to AgentStore ----------------------
# The proxy plugin forwards /api/proxy/agentstore/* to the real AgentStore
# API.  The scaffolder templates use http:backstage:request against this
# proxy path, so RHDH never needs direct cluster networking to AgentStore --
# just its Route URL.
proxy:
  endpoints:
    '/agentstore':
      target: ${AGENTSTORE_URL}   # e.g. https://agentstore.apps.CLUSTER_DOMAIN/api
      changeOrigin: true
      headers:
        # Service-to-service auth token that AgentStore's requireAdmin()
        # accepts as an alternative to the browser cookie.
        X-AgentStore-Token: ${AGENTSTORE_SERVICE_TOKEN}

# -- Catalog: import agent entities + templates from AgentStore API --------
# These locations point at AgentStore's REST endpoints so RHDH auto-discovers
# agents without needing a public GitHub repo.  ${AGENTSTORE_URL} is injected
# from the rhdh-secrets Secret (e.g. https://agentstore-agentstore.apps.CLUSTER_DOMAIN).
catalog:
  rules:
    - allow: [Component, Template, System, Group, Resource, Location]
  # How often RHDH re-reads locations and re-processes entities.
  # Default is ~100-200s; set lower for faster agent discovery.
  processingInterval:
    fromSeconds: 10
    toSeconds: 10
  locations:
    # AgentStore System entity + all published agent Components (dynamic)
    - type: url
      target: ${AGENTSTORE_URL}/rhdh/catalog
      rules:
        - allow: [System, Component]

    # Software Template: "Request a New AI Agent"
    - type: url
      target: ${AGENTSTORE_URL}/rhdh/templates/request-agent
      rules:
        - allow: [Template]

