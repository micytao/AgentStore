# Agent Sandbox Service — in-cluster, next to the OpenShell gateway.
# Uses @nvidia/openshell-sdk (gRPC) to manage sandboxes; no CLI binary needed.
#
# Prereqs before applying:
#   1. Build/push apps/agent-sandbox-service's image; set it below.
#   2. Create the agent-sandbox-service-token Secret (kubectl create secret
#      generic agent-sandbox-service-token -n agent-workloads
#      --from-literal=OPENSHELL_SERVICE_TOKEN=<random value>), and paste the
#      same value into Admin -> Secrets -> Agent Sandbox Service token.
#   3. Set OPENSHELL_GATEWAY_URL to the in-cluster gateway Service URL.
#      For production gateways with OIDC, also provide the OIDC env vars
#      via a Secret (see the optional secretKeyRef entries below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-service
  namespace: agent-workloads
  labels:
    app.kubernetes.io/managed-by: agentstore
    app.kubernetes.io/name: agent-sandbox-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-service
    spec:
      serviceAccountName: agentstore-console
      containers:
        - name: agent-sandbox-service
          image: agent-sandbox-service:dev # replace with your pushed image
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: OPENSHELL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-sandbox-service-token
                  key: OPENSHELL_SERVICE_TOKEN
            # In-cluster gateway URL — required.
            - name: OPENSHELL_GATEWAY_URL
              value: "http://openshell.openshell:8080"
            # Optional: OIDC client-credentials for production gateways.
            # Uncomment and create the openshell-oidc Secret when moving
            # beyond the eval-mode (TLS-off) gateway.
            # - name: OPENSHELL_OIDC_ISSUER
            #   valueFrom:
            #     secretKeyRef:
            #       name: openshell-oidc
            #       key: issuer
            # - name: OPENSHELL_OIDC_CLIENT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: openshell-oidc
            #       key: client-id
            # - name: OPENSHELL_OIDC_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: openshell-oidc
            #       key: client-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-service
  namespace: agent-workloads
  labels:
    app.kubernetes.io/managed-by: agentstore
spec:
  selector:
    app.kubernetes.io/name: agent-sandbox-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
# TLS terminates here (edge). WebSocket upgrades ride over the same HTTPS
# connection — OpenShift Routes support this with no extra config.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-sandbox-service
  namespace: agent-workloads
  labels:
    app.kubernetes.io/managed-by: agentstore
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: agent-sandbox-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
