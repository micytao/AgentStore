apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-store-data
  labels:
    app: agent-store
spec:
  # ReadWriteOnce is sufficient (and correct) because the local secrets vault
  # in apps/web/src/server/secrets.ts is a single-writer file store — it does
  # not support being shared across multiple replicas. Keep replicas: 1.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
