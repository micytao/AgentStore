  "flows": {
    "agentstore_workflow": {
      "label": "AgentStore Workflow",
      "steps": [
        { "text": "1. Admin opens AgentStore console (localhost:3000 or OpenShift Route)", "mode": "lightup", "target": "c_console", "badge": "1" },
        { "text": "2. Configure Platform connections: AAP controller + OpenShift API", "mode": "lightup", "target": "n_platform", "badge": "2" },
        { "text": "3. Save secrets: AAP_TOKEN, OPENSHIFT_TOKEN", "mode": "lightup", "target": "n_secrets", "badge": "3" },
        { "text": "4. Register model provider(s): Anthropic, OpenAI, or MaaS endpoint", "mode": "lightup", "target": "n_providers", "badge": "4" },
        { "text": "5. Optionally register MCP tool servers", "mode": "lightup", "target": "n_mcp", "badge": "5" },
        { "text": "6. Review Skills: Red Hat Skill Packs auto-imported from catalog/skills/", "mode": "lightup", "target": "n_skills", "badge": "6" },
        { "text": "7. Browse the built-in catalog (Support, Engineering, etc.)", "mode": "arrow", "from": "admin", "to": "n_browse", "color": "#58a6ff", "num": 7 },
        { "text": "8. Or onboard a new agent via the wizard", "mode": "lightup", "target": "n_onboard", "badge": "8" },
        { "text": "9. Bind per-agent config: provider, skills, MCP tools", "mode": "lightup", "target": "n_agent_config", "badge": "9" },
        { "text": "10. Publish the listing (draft → published)", "mode": "lightup", "target": "n_review", "badge": "✓" },
        { "text": "11a. Deploy: generic-chat listing → launches AAP job", "mode": "arrow", "from": "n_deploy_generic", "to": "n_aap_jt_generic", "color": "#3fb950", "num": 11, "glow": "c_aap" },
        { "text": "12. AAP creates Deployment + Service + Route in agent-workloads", "mode": "arrow", "from": "n_aap_jt_generic", "to": "n_deployment", "color": "#ffa657", "num": 12, "glow": "c_workloads" },
        { "text": "13. Config.json mounted, API key injected via Secret", "mode": "lightup", "target": "n_config_cm", "badge": "13" },
        { "text": "14. Playbook writes deploy-result ConfigMap with Route host", "mode": "lightup", "target": "n_result_cm", "badge": "14" },
        { "text": "15. AgentStore polls → reads Route URL → status 'running'", "mode": "arrow", "from": "n_result_cm", "to": "n_deploy_poll", "color": "#3fb950", "num": 15 },
        { "text": "16. Persistent chat URL now available — users open it directly", "mode": "lightup", "target": "n_chat_url", "badge": "✓" },
        { "text": "17. User sends a message in the chat page", "mode": "arrow", "from": "user", "to": "n_runtime_server", "color": "#79c0ff", "num": 17 },
        { "text": "18. agent-core runs the turn: system prompt + skills + model call", "mode": "lightup", "target": "n_agent_core", "badge": "18" },
        { "text": "19. Model may call load_skill → full instructions injected", "mode": "lightup", "target": "n_load_skill", "badge": "19" },
        { "text": "20. Model may call MCP tools → tool-hop forwards and returns", "mode": "lightup", "target": "n_tool_hop", "badge": "20" },
        { "text": "21. Model calls LLM API (MaaS or external)", "mode": "arrow", "from": "n_agent_core", "to": "n_maas", "color": "#f0883e", "num": 21 },
        { "text": "22. Response returned to user in the chat page", "mode": "arrow", "from": "n_runtime_server", "to": "user", "color": "#79c0ff", "num": 22 },
        { "text": "11b. Deploy: openshell listing → creates sandbox session directly", "mode": "arrow", "from": "n_deploy_openshell", "to": "n_sandbox_svc", "color": "#d2a8ff", "num": 11, "glow": "c_openshell" },
        { "text": "23. SDK creates sandbox pod on the gateway", "mode": "arrow", "from": "n_sdk_client", "to": "n_gateway", "color": "#d2a8ff", "num": 23 },
        { "text": "24. Sandbox running — user connects via terminal WebSocket", "mode": "arrow", "from": "user", "to": "n_terminal_ws", "color": "#d2a8ff", "num": 24 },
        { "text": "25. Six Red Hat products, one story: RHDH → AgentStore → AAP → OCP → OCP AI → MaaS", "mode": "lightup", "target": "c_infra", "badge": "✓" }
      ]
    },
    "build_process": {
      "label": "Build Process",
      "steps": [
        { "text": "1. Admin opens Platform → AAP Job Templates card", "mode": "arrow", "from": "admin", "to": "n_platform", "color": "#ffa657", "num": 1 },
        { "text": "2. Click 'Create job templates' — auto-creates AAP Project, Inventory, Credential, both JTs", "mode": "arrow", "from": "n_platform", "to": "c_aap", "color": "#ffa657", "num": 2, "glow": "c_aap" },
        { "text": "3. AAP Project syncs from Git (this repo's ansible/ directory)", "mode": "lightup", "target": "n_aap_project", "badge": "3" },
        { "text": "4. K8s Credential created from the same OpenShift token in Platform settings", "mode": "lightup", "target": "n_aap_cred", "badge": "4" },
        { "text": "5. Inventory (localhost) + both Job Templates created", "mode": "lightup", "target": "n_aap_jt_generic", "badge": "5" },
        { "text": "6. Template IDs auto-saved to PlatformSettings", "mode": "arrow", "from": "c_aap", "to": "n_platform", "color": "#ffa657", "num": 6 },
        { "text": "7. Build EE: Admin clicks '+ Build from source' on AAP Job Templates card", "mode": "arrow", "from": "n_platform", "to": "n_bc_ee", "color": "#e3b341", "num": 7, "glow": "c_build" },
        { "text": "8. OpenShift creates BuildConfig + ImageStream for agentstore-ee", "mode": "lightup", "target": "n_bc_ee", "badge": "8" },
        { "text": "9. Build runs: Containerfile from ansible/execution-environment/", "mode": "lightup", "target": "n_imagestream", "badge": "⏳" },
        { "text": "10. Image pushed to internal registry via ImageStream", "mode": "lightup", "target": "n_imagestream", "badge": "✓" },
        { "text": "11. Built image registered as AAP Execution Environment", "mode": "arrow", "from": "n_imagestream", "to": "n_ee_register", "color": "#e3b341", "num": 11 },
        { "text": "12. EE ID saved to PlatformSettings.aapExecutionEnvironmentId", "mode": "arrow", "from": "n_ee_register", "to": "n_platform", "color": "#e3b341", "num": 12 },
        { "text": "13. Build Agent Runtime: Admin → Platform → Agent Runtime → 'Start build'", "mode": "arrow", "from": "n_platform", "to": "n_bc_runtime", "color": "#e3b341", "num": 13 },
        { "text": "14. BuildConfig uses full monorepo as context (apps/ + packages/)", "mode": "lightup", "target": "n_bc_runtime", "badge": "14" },
        { "text": "15. Build completes → image ref saved to agentRuntimeImage", "mode": "arrow", "from": "n_bc_runtime", "to": "n_imagestream", "color": "#e3b341", "num": 15 },
        { "text": "16. Every future generic-chat deploy uses this image automatically", "mode": "arrow", "from": "n_imagestream", "to": "n_deployment", "color": "#3fb950", "num": 16 },
        { "text": "17. Build Agent Sandbox Service: Admin → LLMs → OpenShell → 'Install'", "mode": "arrow", "from": "n_platform", "to": "n_bc_sandbox", "color": "#e3b341", "num": 17 },
        { "text": "18. Needs GITHUB_PACKAGES_TOKEN for @nvidia/openshell-sdk", "mode": "lightup", "target": "n_bc_sandbox", "badge": "🔑" },
        { "text": "19. Post-build: apply Deployment/Service/Route + wait for rollout", "mode": "arrow", "from": "n_bc_sandbox", "to": "n_sandbox_svc", "color": "#d2a8ff", "num": 19 },
        { "text": "20. Service URL + token auto-saved to Platform settings", "mode": "arrow", "from": "n_sandbox_svc", "to": "n_platform", "color": "#d2a8ff", "num": 20 },
        { "text": "21. Deploy AgentStore itself: Admin → Platform → 'Deploy'", "mode": "arrow", "from": "n_platform", "to": "n_bc_agentstore", "color": "#8b949e", "num": 21 },
        { "text": "22. Build: apps/web/Containerfile (Next.js console)", "mode": "lightup", "target": "n_bc_agentstore", "badge": "22" },
        { "text": "23. Post-build: apply agentstore.yaml (NS + PVC + Deploy + Svc + Route)", "mode": "arrow", "from": "n_bc_agentstore", "to": "n_as_deploy", "color": "#8b949e", "num": 23, "glow": "c_agentstore_ocp" },
        { "text": "24. Route URL appears — console now running on-cluster", "mode": "lightup", "target": "n_as_route", "badge": "✓" },
        { "text": "25. RHDH can proxy to in-cluster svc:3000/api (no external Route needed)", "mode": "lightup", "target": "n_as_rhdh_proxy", "badge": "25" },
        { "text": "26. Data sync: laptop pushes state to on-cluster instance", "mode": "lightup", "target": "n_as_sync", "badge": "26" },
        { "text": "27. All four images built from source inside OpenShift — no local tooling required", "mode": "lightup", "target": "c_build", "badge": "✓" }
      ]
    },
    "openshell_via_sdk": {
      "label": "OpenShell (via SDK)",
      "steps": [
        { "text": "1. Prerequisites: Agent Sandbox controller CRDs installed (cluster-scoped, one-time)", "mode": "lightup", "target": "n_gateway", "badge": "①" },

        { "text": "4. Agent Sandbox Service built and deployed (apps/agent-sandbox-service)", "mode": "lightup", "target": "n_sandbox_svc", "badge": "4" },
        { "text": "5. SDK client connects to gateway: OpenShellClient.connect()", "mode": "arrow", "from": "n_sandbox_svc", "to": "n_sdk_client", "color": "#d2a8ff", "num": 5 },
        { "text": "6. OIDC client-credentials (production) or no auth (eval mode)", "mode": "lightup", "target": "n_sdk_client", "badge": "🔐" },

        { "text": "8. engine-openshell: POST /sessions → { taskId, agent, model, mcpServers }", "mode": "arrow", "from": "n_deploy_openshell", "to": "n_sandbox_svc", "color": "#d2a8ff", "num": 8 },
        { "text": "9. Sessions module resolves sandbox image from OPENSHELL_AGENTS registry", "mode": "lightup", "target": "n_sandbox_pod", "badge": "🖼️" },
        { "text": "10. SDK: client.sandbox.create() with image, command, isolation policy", "mode": "arrow", "from": "n_sdk_client", "to": "n_gateway", "color": "#d2a8ff", "num": 10 },
        { "text": "11. Sandbox command: openshellCommandForAgent() → e.g. ['sh','-c','opencode']", "mode": "lightup", "target": "n_sandbox_pod", "badge": "11" },
        { "text": "12. SDK: client.sandbox.waitReady(name, 300s) — covers cold image pulls", "mode": "lightup", "target": "n_sandbox_pod", "badge": "⏳" },
        { "text": "13. Upload config: exec(['sh','-c','cat > .config/opencode/opencode.json']) via stdin", "mode": "lightup", "target": "n_sandbox_pod", "badge": "📋" },
        { "text": "14. Optionally: git clone repo into /workspace", "mode": "lightup", "target": "n_sandbox_pod", "badge": "14" },
        { "text": "15. Session phase → 'Running', persisted onto listing.openshellSession", "mode": "arrow", "from": "n_sandbox_svc", "to": "n_deploy_openshell", "color": "#3fb950", "num": 15 },
        { "text": "16. User clicks 'Open terminal' on the listing page", "mode": "arrow", "from": "user", "to": "n_listing", "color": "#58a6ff", "num": 16 },
        { "text": "17. Console calls POST /sessions/:id/terminal-token → short-lived HMAC token", "mode": "arrow", "from": "n_listing", "to": "n_sandbox_svc", "color": "#d2a8ff", "num": 17 },
        { "text": "18. Console opens WebSocket: wss://<route>/sessions/:id/terminal?token=...", "mode": "arrow", "from": "n_listing", "to": "n_terminal_ws", "color": "#d2a8ff", "num": 18 },

        { "text": "21. Bidirectional byte relay: browser ↔ WebSocket ↔ execInteractive output", "mode": "lightup", "target": "n_terminal_ws", "badge": "↔" },

        { "text": "23. Resize: {type:'resize',cols:N,rows:N} text frame → session.resize()", "mode": "lightup", "target": "n_terminal_ws", "badge": "↕" },

    { "color": "#d2a8ff", "label": "Collaborative (OpenShell)" },
    { "color": "#79c0ff", "label": "Agent Runtime / RHDH" },
    { "color": "#f0883e", "label": "Model Serving (MaaS / LLM)" },
    { "color": "#e3b341", "label": "OpenShift Builds" },

    { "color": "#f85149", "label": "Teardown / Error" }
  ]
};

await viz.load(diagram);

const cvs = document.getElementById('fs-canvas');
cvs.addEventListener('mousemove', e => {
  const rect = cvs.getBoundingClientRect();
  const eng = viz._engine;
  const mx = (e.clientX - rect.left - eng._ox) / eng._sc;
  const my = (e.clientY - rect.top - eng._oy) / eng._sc;
  let hit = false;
  for (const [k, n] of Object.entries(eng.state.nodes)) {
    if (n.type === 'boundary' || n.type === 'container') continue;
    if (eng.state.tooltips[k] && mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
      hit = true;
      break;
    }
  }
  cvs.style.cursor = hit ? 'pointer' : 'default';
});

viz.state.loopMode = true;
viz.play();
</script>
