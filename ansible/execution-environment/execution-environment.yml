---
# ansible-builder (v3 schema) definition for the Execution Environment
# AgentStore's two Job Templates need — see ../README.md's "AAP Job
# Templates" bootstrap and Admin -> Platform -> AAP Job Templates.
#
# provision-generic-agent.yml needs the `kubernetes.core` collection
# (plus its Python `kubernetes` client library, pulled in via
# requirements.txt below). provision-openshell-gateway.yml additionally
# needs the `helm` CLI, installed via additional_build_steps since it's
# not an Ansible collection or a pip/system package.
#
# Build (from this directory):
#   pip install ansible-builder
#   ansible-builder build \
#     -t <your-registry>/agentstore-ee:latest \
#     -f execution-environment.yml \
#     --container-runtime podman
#   podman push <your-registry>/agentstore-ee:latest
#
# Then either add it in AAP's web UI (Automation Execution ->
# Infrastructure -> Execution Environments -> Add), or use Admin ->
# Platform -> AAP Job Templates -> "Register execution environment" in
# AgentStore, which calls the AAP API for you (no image build — that
# part still has to happen here, locally/in CI, first).
version: 3

images:
  base_image:
    # quay.io/ansible/ansible-runner:latest looks like the obvious
    # choice but is the wrong image: it's frozen since April 2022,
    # permanently stuck on ansible-core 2.12.5 / an old Python (2.12.5
    # is too old for any current kubernetes.core release, and one of
    # its own bundled dependencies crashes with "cannot import name
    # 'files' from importlib.resources" -- a Python 3.9+ stdlib API --
    # when actually running a playbook). awx-ee is the actively
    # maintained image actually meant to be extended into custom EEs.
    name: quay.io/ansible/awx-ee:latest

dependencies:
  galaxy: requirements.yml
  python: requirements.txt

additional_build_steps:
  append_final:
    # get-helm-3 shells out to `openssl` to verify the downloaded
    # binary's checksum, which this base image doesn't include by
    # default. Rather than installing it via a package manager (its
    # dnf/yum repos point at CentOS's public mirrorlist, which many
    # locked-down networks can't resolve — see ./Containerfile),
    # VERIFY_CHECKSUM=false skips that step entirely; only `curl` (to
    # GitHub) is needed.
    - RUN curl -fsSL -o /tmp/get-helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    - RUN chmod +x /tmp/get-helm.sh && VERIFY_CHECKSUM=false /tmp/get-helm.sh --no-sudo && rm /tmp/get-helm.sh
