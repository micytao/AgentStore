---
# AAP Project playbook. Extra vars come from AgentStore (engine-ansible's
# extraVars(), packages/engine-ansible/src/index.ts):
#   listing_id, listing_name, task_id, goal, success_criteria,
#   namespace, job_name, mode, agent_runtime_image (optional),
#   provider_kind, provider_base_url, provider_default_model, provider_api_key,
#   intro_lines (list of strings), skills (list of Skill objects)
#
# The Skills Agent's one-shot draft shape — same agent-runtime image and
# same mounted config.json convention as provision-generic-agent.yml's
# persistent-chat shape (RUN_MODE=once instead of unset), so this Job is
# exactly as Skills-aware as a deployed chat agent, via a real
# @agentstore/agent-core runTurn() instead of the retired, Skills-unaware
# ansible/agent-runner/runner.py.
#
# Creates the agent Job, waits for it to finish, then publishes a
# `<job_name>-result` ConfigMap with the pod's stdout log so AgentStore's
# readResultConfigMap() picks up the real draft instead of falling back to
# a client-side placeholder.
- name: Provision an AgentStore Skills Agent Job on OpenShift
  hosts: localhost
  gather_facts: false
  vars:
    namespace: "{{ namespace | default('agent-workloads') }}"
    job_name: "{{ job_name }}"
    listing_id: "{{ listing_id }}"
    listing_name: "{{ listing_name }}"
    task_id: "{{ task_id }}"
    goal: "{{ goal | default('') }}"
    success_criteria: "{{ success_criteria | default('') }}"
    agent_runtime_image: "{{ agent_runtime_image | default('agent-runtime:dev') }}"
    provider_kind: "{{ provider_kind | default('openai-compatible') }}"
    provider_base_url: "{{ provider_base_url | default('') }}"
    provider_default_model: "{{ provider_default_model | default('') }}"
    provider_api_key: "{{ provider_api_key | default('') }}"
    intro_lines: "{{ intro_lines | default([]) }}"
    skills: "{{ skills | default([]) }}"
    config_json: >-
      {{ {
        'listingName': listing_name,
        'introLines': intro_lines,
        'skills': skills,
        'mcpServers': [],
      } | to_json }}
  tasks:
    - name: Ensure agent-workloads namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentstore

    - name: Create the Job's config Secret (env scalars + config.json)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ job_name }}-config"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentstore
              app.kubernetes.io/name: agent-runtime
              agentstore/task-id: "{{ task_id }}"
              agentstore/listing-id: "{{ listing_id }}"
          type: Opaque
          stringData:
            LISTING_NAME: "{{ listing_name }}"
            PROVIDER_KIND: "{{ provider_kind }}"
            PROVIDER_BASE_URL: "{{ provider_base_url }}"
            PROVIDER_DEFAULT_MODEL: "{{ provider_default_model }}"
            PROVIDER_API_KEY: "{{ provider_api_key }}"
            config.json: "{{ config_json }}"

    - name: Create agent Job
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "{{ job_name }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentstore
              app.kubernetes.io/name: agent-runtime
              agentstore/task-id: "{{ task_id }}"
              agentstore/listing-id: "{{ listing_id }}"
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels:
                  app.kubernetes.io/managed-by: agentstore
                  agentstore/task-id: "{{ task_id }}"
              spec:
                restartPolicy: Never
                containers:
                  - name: agent
                    image: "{{ agent_runtime_image }}"
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: RUN_MODE
                        value: once
                      - name: TASK_ID
                        value: "{{ task_id }}"
                      - name: GOAL
                        value: "{{ goal }}"
                      - name: SUCCESS_CRITERIA
                        value: "{{ success_criteria }}"
                      - name: RESULT_FILE
                        value: /output/draft.txt
                    envFrom:
                      - secretRef:
                          name: "{{ job_name }}-config"
                    volumeMounts:
                      - name: config
                        mountPath: /etc/agent
                        readOnly: true
                      - name: output
                        mountPath: /output
                volumes:
                  - name: config
                    secret:
                      secretName: "{{ job_name }}-config"
                      items:
                        - key: config.json
                          path: config.json
                  - name: output
                    emptyDir: {}

    # Without this, the agent's real output never leaves the Job's pod: the
    # console only knows how to read a `<job_name>-result` ConfigMap
    # (packages/engine-ansible/src/openshift.ts readResultConfigMap()), and
    # up to this point nothing has ever created one. RBAC for configmaps is
    # already granted to this playbook's ServiceAccount in
    # deploy/openshift/agent-workloads.yaml (aap-agent-provisioner Role).
    - name: Wait for agent Job to finish
      kubernetes.core.k8s_info:
        kind: Job
        api_version: batch/v1
        name: "{{ job_name }}"
        namespace: "{{ namespace }}"
      register: job_info
      until: >
        (job_info.resources[0].status.succeeded | default(0)) > 0 or
        (job_info.resources[0].status.failed | default(0)) > 0
      retries: 60
      delay: 5

    - name: Find the agent pod for this task
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - "agentstore/task-id={{ task_id }}"
      register: pod_info

    - name: Read agent pod logs
      kubernetes.core.k8s_log:
        namespace: "{{ namespace }}"
        name: "{{ pod_info.resources[0].metadata.name }}"
      register: pod_log
      when: pod_info.resources | length > 0

    - name: Publish agent result ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ job_name }}-result"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentstore
              agentstore/task-id: "{{ task_id }}"
          data:
            draft: "{{ pod_log.log | default('') }}"
            status: >-
              {{ 'succeeded' if (job_info.resources[0].status.succeeded | default(0)) > 0 else 'failed' }}
      when: pod_info.resources | length > 0
